name: Build and validate plugins

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python3 scripts/build.py
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - run: python3 scripts/build.py --check
      - name: Check tracked marketplace catalogs
        run: git diff --exit-code -- .agents/plugins/marketplace.json .claude-plugin/marketplace.json
      - name: Upload production plugin
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: world-id-${{ github.sha }}
          path: plugins/world-id/
          include-hidden-files: true
          if-no-files-found: error
      - name: Upload sandbox plugin
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: world-id-sandbox-${{ github.sha }}
          path: plugins/world-id-sandbox/
          include-hidden-files: true
          if-no-files-found: error
