name: Build and validate plugins

on:
  pull_request:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python3 scripts/build.py --validate
      - name: Test and build from sandbox source
        if: hashFiles('release.json') == ''
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          python3 -m unittest discover -s scripts -p 'test_*.py'
          python3 scripts/build.py --source-sha "$SOURCE_SHA"
      - name: Upload release previews
        if: hashFiles('release.json') == ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-previews-${{ github.sha }}
          path: dist/
          include-hidden-files: true
          if-no-files-found: error
