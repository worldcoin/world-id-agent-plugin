name: Open release PRs

on:
  workflow_dispatch:
    inputs:
      version:
        description: New plugin version (for example, 0.2.0)
        required: true
        type: string
      source_sha:
        description: Optional full dev commit SHA; leave blank for the latest dev commit
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: plugin-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check release credentials
        env:
          APP_CLIENT_ID: ${{ vars.PLUGIN_RELEASE_APP_CLIENT_ID }}
          APP_PRIVATE_KEY: ${{ secrets.PLUGIN_RELEASE_APP_PRIVATE_KEY }}
        run: |
          if [[ -z "$APP_CLIENT_ID" || -z "$APP_PRIVATE_KEY" ]]; then
            echo 'Configure repository variable PLUGIN_RELEASE_APP_CLIENT_ID and secret PLUGIN_RELEASE_APP_PRIVATE_KEY before releasing' >&2
            exit 1
          fi
      - name: Create release app token
        id: release-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.PLUGIN_RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.PLUGIN_RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: dev
          fetch-depth: 0
          token: ${{ steps.release-token.outputs.token }}
      - name: Select reviewed source commit
        id: source
        env:
          REQUESTED_SHA: ${{ inputs.source_sha }}
        run: |
          SOURCE_SHA="${REQUESTED_SHA:-$(git rev-parse HEAD)}"
          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'source_sha must be a full lowercase commit SHA' >&2
            exit 1
          fi
          git merge-base --is-ancestor "$SOURCE_SHA" origin/dev
          git checkout --detach "$SOURCE_SHA"
          echo "sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "Source commit: \`$SOURCE_SHA\`" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Validate and build both releases
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          python3 scripts/build.py --validate
          python3 -m unittest discover -s scripts -p 'test_*.py'
          python3 scripts/build.py --source-sha "$SOURCE_SHA" --version "$RELEASE_VERSION"
          printf 'Release version: `%s`\n' "$RELEASE_VERSION" >> "$GITHUB_STEP_SUMMARY"
      - name: Open protected-branch release PRs
        env:
          GH_TOKEN: ${{ steps.release-token.outputs.token }}
          GH_PROMPT_DISABLED: '1'
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: python3 scripts/release.py --source-sha "$SOURCE_SHA" --repository "$GH_REPO"
